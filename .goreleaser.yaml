# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: strop

builds:
  - skip: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_source"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  abbrev: -1

release:
  name_template: "v{{.Version}}"
